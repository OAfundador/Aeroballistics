[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spin73"
version = "0.5.0"
description = "Reconstructed SPIN-73: aerodynamic coefficients of spin-stabilized projectiles from their geometry (Picatinny TR 4588, 1973)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luiz Guilherme de Padua Sanches" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = [
    "ballistics",
    "exterior-ballistics",
    "aerodynamics",
    "aerodynamic-coefficients",
    "spin-stabilized",
    "6-dof",
    "spin-73",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = ["pytest>=7"]
reading = ["pillow>=9"]          # only scripts/reading/ (pages of the scan and the PDFs)
dev = ["pytest>=7", "pillow>=9"]

[project.urls]
Repository = "https://github.com/OAfundador/aeroballistics"

[project.scripts]
spin73 = "spin73.cli:_run"

[tool.setuptools.packages.find]
where = ["src"]
include = ["spin73*"]

[tool.setuptools.package-data]
spin73 = ["corrections/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
