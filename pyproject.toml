[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroballistics"
version = "0.6.0"
description = "Coeficientes aerodinâmicos de projéteis estabilizados por rotação a partir da geometria, inspirado e adaptado do SPIN-73 (Picatinny TR 4588, 1973)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luiz Guilherme de Padua Sanches" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = [
    "ballistics",
    "exterior-ballistics",
    "aerodynamics",
    "aerodynamic-coefficients",
    "spin-stabilized",
    "6-dof",
    "spin-73",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
teste = ["pytest>=7"]
leitura = ["pillow>=9"]          # só scripts/leitura/ (páginas do scan e dos PDFs)
dev = ["pytest>=7", "pillow>=9"]

[project.urls]
Repository = "https://github.com/OAfundador/aeroballistics"

[project.scripts]
aeroballistics = "aeroballistics.cli:_executar"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aeroballistics*"]

[tool.setuptools.package-data]
aeroballistics = ["correcoes/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
